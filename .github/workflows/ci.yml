name: Reproduce and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      MPLCONFIGDIR: /tmp/voice_of_customer-matplotlib
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: bash scripts/run_all.sh
      - run: uv run --frozen python scripts/smoke_test.py --report-path artifacts/demo_smoke.json
