[project]
name = "voice-of-customer-nlp"
version = "1.0.0"
description = "Voice of Customer — Arabic customer feedback analysis, SDAIA Academy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1", "scipy==1.15.3",
  "gradio==5.49.1", "matplotlib==3.10.7",
  "pytest==8.4.2", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
